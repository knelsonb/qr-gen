# Serves site/ with the same response headers as site/_headers. Used on the pve route; a test
# checks the two stay identical. Cache-Control comes from a map because an add_header inside a
# location block would discard every header set here.

map $uri $qr_cache_control {
    default            "public, max-age=3600";
    ~^/(sw\.js|index\.html)?$  "no-cache";
}

server {
    listen 80;
    server_name qr.thetallkeith.com;
    root /srv/qr/site;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; manifest-src 'self'; worker-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $qr_cache_control always;

    types {
        application/manifest+json webmanifest;
        text/javascript js;
        image/svg+xml svg;
    }

    location /.well-known/ { }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
