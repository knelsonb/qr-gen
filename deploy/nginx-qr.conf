# Serves site/ with the same response headers as site/_headers. Used on the pve route; a test
# checks the two stay identical. Cache-Control comes from a map because an add_header inside a
# location block would discard every header set here. Every file revalidates (no-cache with an
# ETag is one small request), so a deploy never leaves the edge serving new HTML with old
# scripts; only the fonts, which never change, are cached for long, and only when they are
# actually served (a 404 under /fonts/ is text/html).

map $sent_http_content_type $qr_cache_control {
    default      "no-cache";
    ~^font/woff2 "public, max-age=604800";
}

server {
    # CT 117 also serves thetallkeith.com's sites; only the qr tunnel connects, over loopback.
    listen 127.0.0.1:8085;
    server_name qr.thetallkeith.com;
    root /srv/qr/site;
    index index.html;
    server_tokens off;
    client_max_body_size 1k;

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/manifest+json text/plain;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; upgrade-insecure-requests; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; manifest-src 'self'; worker-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $qr_cache_control always;

    # A types block here would replace the whole mime table, so only the missing types are set.
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location ~ \.woff2$ { default_type font/woff2; }

    # The exact match outranks the dot-file rule below for this one file.
    location = /.well-known/security.txt { }
    location ~ /\. { deny all; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
